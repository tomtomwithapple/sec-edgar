# EDGAR watchlist (docs/plans/us-fin-ingest.md, How > SEC EDGAR > Feed). A filing in the feed
# with a party on this list queues the company's submissions JSON, and its 8-K / 8-K/A also
# queue companyfacts (decision C: every 10-K/10-Q filer gets companyfacts anyway).
# CIKs as plain integers. Seeded in S22 with three large filers; edit freely.
watchlist:
  - 320193    # Apple Inc.
  - 19617     # JPMorgan Chase & Co.
  - 789019    # Microsoft Corp.

# Form 4 documents (job edgar_form4, chained after edgar_feed and edgar_reconcile). Each queued
# filing costs 2 requests (folder index.json + ownership XML); a run drains at most this many,
# oldest first, so a backlog does not stall the 15-minute feed chain. Measured 2026-10-07:
# ~0.7 s per document (SEC transfer time, ~3 requests/s, under the 8 rps cap), so 300 is about
# 3.5 min. The rest wait for the next run.
form4:
  max_docs_per_run: 300

# Schedule 13D/G documents (job edgar_sched13, chained after edgar_feed and edgar_reconcile).
# Each queued structured filing costs 2 requests (folder index.json + primary_doc.xml), a legacy
# SC 13D/13G one (no XML; skipped and counted) 1; a run drains at most this many, oldest first.
sched13:
  max_docs_per_run: 300

# Daily index (job edgar_reconcile). Today's master.YYYYMMDD.idx is requested only from this New
# York time on: SEC wrote 10-01, 10-02, 10-06 and 10-07's files at 22:01-22:04 ET (Last-Modified,
# probed 2026-10-08) and answers 403 (S3 AccessDenied) for a file not written yet — S32's 03:47 ET
# catch-up asked for one and opened the 10-minute SEC block. The 23:30 cron is after it.
daily_index:
  published_after: "22:30"
