# Per-host rate limits (requests per second) and extra request headers.
# Hosts listed in one bucket share its limit; unlisted hosts get their own bucket at default_rate.
# SEC hosts may never exceed 8 rps (enforced on load). User-Agent is set by code, not here.
default_rate: 4

buckets:
  sec:
    hosts: [www.sec.gov, data.sec.gov]
    rate: 8
    headers:
      Accept-Encoding: gzip, deflate
  fred:
    hosts: [api.stlouisfed.org]
    rate: 2  # FRED allows 120 requests a minute
  # Alpaca (free plan): 200 requests a minute per account; 3 rps = 180/min stays under it.
  # The key headers are added by code from APCA_API_KEY_ID / APCA_API_SECRET_KEY, never here.
  alpaca_data:
    hosts: [data.alpaca.markets]
    rate: 3
  alpaca_trading:
    hosts: [paper-api.alpaca.markets]
    rate: 3
