# Schedule, due days and alert rules per job (docs/plans/us-fin-ingest.md, How > Alerts and
# How > Scheduler). Each source slice adds its own job here.
#
#   <job>:
#     cron: "m h dom mon dow"      # America/New_York; read by the scheduler (S10); no cron =
#                                  # not scheduled. Day of week by name only (mon..sun):
#                                  # APScheduler 3 numbers Monday 0, cron numbers Sunday 0.
#     calendar: federal|bond|nyse|any
#     due: <rule>                  # due days for alert rules: a calendar name, none, or
#                                  # {calendar: federal, nth_of_month: 8}; default = calendar
#     alerts:                      # rules for every watermark key
#       zero_new_rows: {}          # due day and no row dated after the day's first watermark;
#                                  # {after: "HH:MM"} judges it only from that NY time (S35)
#       stale_watermark: {n: 2}    # more than n due days after the watermark
#       value_jump: {pct: 25}      # a new row moved > pct % from the series' previous row
#       row_count_swing: {pct: 2}  # full-file snapshots only
#     keys:                        # per-key overrides: due, or a rule's params (null = off)
#       <key>: {due: none, value_jump: {pct: 50}}
jobs:
  fiscal:
    cron: "0 17 * * *"
    calendar: federal
    due: federal                   # DTS and Debt to the Penny publish every federal day
    alerts:
      zero_new_rows: {after: "17:00"}   # they publish ~16:00 ET: a run before the 17:00 fire
                                        # (manual, catch-up) judges nothing (S35)
      stale_watermark: {n: 2}
      value_jump: {pct: 25}
    keys:
      debt_to_penny:
        value_jump: {pct: 5}       # never moved 10% in a day over the year to 2026-10
      mts_table_1:
        due: {calendar: federal, nth_of_month: 8}   # MTS: 8th federal day of the month
        stale_watermark: {n: 1}
        value_jump: {pct: 100}     # month deficit lines flip sign; over the year to 2026-10
                                   # 25% was crossed 18 times, 100% 5 times
      # irregular releases (auction days, month ends, quarter ends): no due days, so no
      # zero_new_rows or stale_watermark; value_jump still checks their new rows
      auctions: {due: none}
      avg_interest_rates: {due: none}
      rates_of_exchange: {due: none}
  treasurydirect:
    cron: "0 14 * * *"             # after the 11:30 and 13:00 ET auction results
    calendar: bond
    due: bond
    keys:
      announced: {due: none}       # newest announced auction date: no rules
      results:
        # newest auction date with results; since 2015 at most 3 bond days in a row passed
        # without an auction (since 2023 at most 1), and some bond days have none, so no
        # zero_new_rows
        stale_watermark: {n: 3}
  bls:
    cron: "0 9 * * *"              # BLS releases at 08:30 ET (JOLTS 10:00); in serve, a release
                                   # day without the new period retries every 15 min (10 with
                                   # BLS_API_KEY) to 12:00, then raises stale_watermark itself
    calendar: federal
    due: {releases: bls_release}   # each series' release days (bls.yaml release, bls_release)
    alerts:
      # no zero_new_rows / stale_watermark rules: the retry decides on release days, and the
      # watermark is a period (2026-M08), not a date
      value_jump: {pct: 25}        # overridden per series by bls.yaml jump_pct
  bls_calendar:
    cron: "0 6 * * mon"            # the release schedule; calendar_stale when it reaches < 30 days
    calendar: any
    due: none
  fred:
    cron: "30 18 * * *"            # FRED series (fred.yaml); H.15 rates for a day appear the
                                   # next afternoon (DGS10 2026-10-08 had vintage 10-09, updated
                                   # 15:16 CT), weekly and monthly series on their release days
    calendar: federal
    due: none                      # mixed frequencies: no zero_new_rows / stale_watermark
    alerts:
      value_jump: {pct: 25}        # only series with jump_pct in fred.yaml are checked, at it
  tic:
    cron: "15 17 * * *"            # TIC cross-border securities (cslt.zip, S43): monthly, the
                                   # 2026-09 file was modified 16:02 ET; other days the
                                   # If-Modified-Since request is a 304 and stores nothing
    calendar: federal
    due: none                      # no release calendar: no zero_new_rows / stale_watermark
  edgar_tickers:
    cron: "15 7 * * *"             # SEC's ticker map (company_tickers.json): a full file, no
                                   # watermark; pairs it drops are kept inactive
    calendar: any
    due: none
  edgar_feed:
    cron: "*/15 6-22 * * *"        # latest filings; EDGAR accepts 06:00-22:00 ET, so the last
                                   # polls (22:00-22:45) pick up the 21:45-22:00 filings.
                                   # Chains edgar_submissions, edgar_companyfacts, edgar_form4,
                                   # edgar_sched13.
    calendar: federal
    due: federal
    alerts:
      stale_watermark: {n: 1}      # no new filing seen over a whole federal day
  edgar_reconcile:
    cron: "30 23 * * *"            # master.YYYYMMDD.idx for the federal days from
                                   # min(watermark, today - 7d); today's only from edgar.yaml
                                   # daily_index.published_after (22:30 ET; a run before it,
                                   # e.g. a catch-up at startup, stops at yesterday), and a
                                   # 404/403 for it is normal. Form 4 / 13D/G accessions are queued;
                                   # chains edgar_form4, edgar_sched13.
    calendar: federal
    due: federal
    alerts:
      stale_watermark: {n: 1}      # no new day's index over more than one federal day
  edgar_submissions:               # no cron: drains pending_doc kind submissions, chained after
                                   # edgar_feed (S22); `usfin edgar submissions --cik` by hand
    calendar: federal
    due: none
  edgar_companyfacts:              # no cron: drains pending_doc kind companyfacts, chained after
                                   # edgar_feed (S22); `usfin edgar facts --cik` by hand
    calendar: federal
    due: none
  edgar_form4:                     # no cron: drains pending_doc kind form4 (oldest first, at most
                                   # edgar.yaml form4.max_docs_per_run), chained after edgar_feed
                                   # and edgar_reconcile (S24)
    calendar: federal
    due: none
  edgar_sched13:                   # no cron: drains pending_doc kind sched13 (oldest first, at most
                                   # edgar.yaml sched13.max_docs_per_run), chained after edgar_feed
                                   # and edgar_reconcile (S25)
    calendar: federal
    due: none
  edgar_bulk:
    cron: "0 3 * * sun"            # weekly bulk reconcile: re-downloads companyfacts.zip and
                                   # submissions.zip through the free-disk guard (disk_low +
                                   # skipped when they do not fit), re-parses only members whose
                                   # CRC changed (submissions: edgar_company CIKs only), then
                                   # prunes the bulk ZIPs to the newest 2 per dataset.
                                   # USFIN_BULK_LIMIT caps the members parsed per ZIP.
    calendar: any
    due: none
  symbols:
    cron: "0 7 * * *"              # Nasdaq Trader's symbol directory (nasdaqlisted.txt and
                                   # otherlisted.txt), created ~03:03 ET; a file without its
                                   # File Creation Time trailer is rejected (snapshot_rejected)
    calendar: nyse
    due: nyse
    alerts:
      zero_new_rows: {after: "07:00"}   # no newer snapshot than the day's first watermark;
                                        # files are created ~03:03 ET, judged from the 07:00 fire
      stale_watermark: {n: 1}      # no new snapshot over a whole NYSE day
      row_count_swing: {pct: 2}    # rows vs the file's previous snapshot (none for the first)
  alpaca_assets:
    cron: "30 7 * * *"             # Alpaca's asset list (/v2/assets?asset_class=us_equity), one
                                   # ~25 s call; a list identical to the newest snapshot is not
                                   # stored again but still moves the watermark
    calendar: any
    due: any
    alerts:
      row_count_swing: {pct: 2}    # rows vs the previous stored snapshot: stored, not diffed
      stale_watermark: {n: 1}      # no confirmed list over a whole day
  alpaca_corp_actions:
    cron: "45 7 * * *"             # Alpaca's corporate actions (/v1/corporate-actions), every
                                   # type, process_date from watermark - 30 d to today + 90 d
                                   # (a dividend's process_date is its payable date); actions
                                   # are processed on weekdays only
    calendar: nyse
    due: nyse
    alerts:
      stale_watermark: {n: 2}      # no action processed over two NYSE days
  alpaca_bars:
    cron: "30 20 * * *"            # Alpaca daily bars (/v2/stocks/bars, sip, raw, asof=-), after
                                   # extended hours: active universe symbols from watermark - 5 d
                                   # (a missed day is caught up), plus up to new_symbol_cap
                                   # symbols whose history was never asked, in full; never an
                                   # `end` (the free plan refuses today's)
    calendar: nyse
    due: nyse
    alerts:
      zero_new_rows: {after: "20:30"}   # no bar dated after the day's first watermark; a run
                                        # before 20:30 (manual, catch-up) judges nothing
      stale_watermark: {n: 1}      # no new bar date over a whole NYSE day
      # no value_jump: splits move raw prices by any amount
