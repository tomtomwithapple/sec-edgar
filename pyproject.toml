[project]
name = "usfin"
version = "0.1.0"
description = "US public financial data ingestion: SEC EDGAR, Treasury, BLS, Nasdaq Trader"
readme = "README.md"
authors = [
    { name = "Tommy Yohanes", email = "tommy.yohanes@tuntun.co.id" }
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler==3.11.3",
    "defusedxml==0.7.1",
    "duckdb==1.5.6",
    "fastapi==0.142.2",
    "holidays==0.106",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "typer==0.27.3",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "respx==0.23.1",
    "ruff==0.16.10",
]

[project.scripts]
usfin = "usfin.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real network endpoints (run with -m live)"]
addopts = "-m 'not live'"
# starlette 1.7 (via fastapi 0.142.2) wants `httpx2` for TestClient; the stack pins httpx 0.28.1
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
