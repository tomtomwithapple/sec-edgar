<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ title or "usfin" }}{% endblock %} · usfin</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">usfin</a>
  <nav>
    <a href="/"{% if nav == "jobs" %} aria-current="page"{% endif %}>Jobs</a>
    <a href="/alerts"{% if nav == "alerts" %} aria-current="page"{% endif %}>Alerts</a>
    <a href="/series"{% if nav == "series" %} aria-current="page"{% endif %}>Series</a>
    <a href="/edgar"{% if nav == "edgar" %} aria-current="page"{% endif %}>EDGAR</a>
    <a href="/screen"{% if nav == "screen" %} aria-current="page"{% endif %}>Screen</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer class="foot">Times are UTC (Z) unless marked ET.</footer>
</body>
</html>
